<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: oklch(0.985 0.002 90);
    background-image: radial-gradient(oklch(0.12 0.01 60 / 18%) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: "JetBrains Mono", monospace;
    position: relative;
  }
  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid oklch(0.12 0.01 60 / 10%);
  }
  .content {
    position: absolute;
    left: 96px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 920px;
  }
  .tile {
    width: 108px;
    height: 108px;
    border-radius: 22px;
    background: oklch(0.12 0.01 60);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }
  .bars { display: flex; align-items: center; gap: 6px; }
  .bar { width: 10px; border-radius: 5px; background: oklch(0.985 0.002 90); }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 17px;
    letter-spacing: 0.1em;
    color: oklch(0.45 0.02 60);
    margin-bottom: 22px;
  }
  .eyebrow .line { width: 40px; height: 1px; background: oklch(0.12 0.01 60 / 30%); display: block; }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 148px;
    line-height: 0.95;
    font-weight: 400;
    color: oklch(0.12 0.01 60);
    letter-spacing: -0.01em;
    margin-bottom: 28px;
  }
  p.tagline {
    font-size: 21px;
    line-height: 1.5;
    color: oklch(0.45 0.02 60);
    max-width: 640px;
  }
  .footerline {
    position: absolute;
    left: 96px;
    right: 96px;
    bottom: 48px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 15px;
    color: oklch(0.45 0.02 60);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="content">
    <div class="tile">
      <div class="bars">
        <div class="bar" style="height: 22px;"></div>
        <div class="bar" style="height: 34px;"></div>
        <div class="bar" style="height: 46px;"></div>
        <div class="bar" style="height: 34px;"></div>
        <div class="bar" style="height: 22px;"></div>
      </div>
    </div>
    <div class="eyebrow"><span class="line"></span>VERIFIABLE PUBLIC INPUT</div>
    <h1>Dovox</h1>
    <p class="tagline">One real human per voice, and a record anyone can recount.</p>
  </div>
  <div class="footerline">
    <span>WORLD ID &middot; ENSv2 &middot; ARKIV &middot; SWARM</span>
    <span>ETHGLOBAL MUMBAI 2026</span>
  </div>
</body>
</html>
